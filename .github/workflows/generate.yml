name: CIGO Mappe - generazione PDF
on:
  push:
    paths:
      - 'requests/**'
      - 'render_map.py'
      - '.github/workflows/generate.yml'
  workflow_dispatch:
concurrency:
  group: cigo-mappe-generation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check reportlab pymupdf
      - run: python cache_photos.py
      - run: python render_map.py
      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/*.pdf assets/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Genera mappe PDF [skip ci]'
            git push
          fi
